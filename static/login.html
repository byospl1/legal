<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión — Sistema de llenado de Tabs EOIR</title>
<link rel="stylesheet" href="/static/styles.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { width: 100%; max-width: 380px; margin: 0 16px; }
  .login-card .brand { justify-content: center; margin-bottom: 18px; }
  .login-card label { display: block; font-size: 13px; margin: 14px 0 6px; }
  .login-card input { width: 100%; box-sizing: border-box; padding: 9px 11px; font-size: 14px; }
  .login-card button { width: 100%; margin-top: 18px; padding: 10px; font-size: 14px; }
  .login-error { color: #b3261e; font-size: 13px; margin-top: 12px; min-height: 1.2em; }
</style>
</head>
<body>

<div class="watermark" aria-hidden="true">Autoría: Hugo</div>

<section class="panel login-card">
  <div class="brand">
    <div class="brand-mark">KC</div>
    <div class="brand-text">
      <h1 style="font-size:16px;">Sistema de llenado de Tabs — EOIR</h1>
      <p>Kostiv Cardinal International Law Group Corp.</p>
    </div>
  </div>

  <form id="login-form">
    <label for="usuario" id="usuario-label">Usuario</label>
    <input id="usuario" name="usuario" type="text" autocomplete="username" required autofocus>

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit">Entrar</button>
    <p class="login-error" id="login-error"></p>
  </form>
</section>

<script src="/static/login.js"></script>

</body>
</html>
