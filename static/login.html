<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión — Sistema de llenado de Tabs EOIR</title>
<link rel="stylesheet" href="/static/styles.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { width: 100%; max-width: 380px; margin: 0 16px; }
  .login-card .brand { justify-content: center; margin-bottom: 18px; }
  .login-card label { display: block; font-size: 13px; margin: 14px 0 6px; }
  .login-card input { width: 100%; box-sizing: border-box; padding: 9px 11px; font-size: 14px; }
  .login-card button { width: 100%; margin-top: 18px; padding: 10px; font-size: 14px; }
  .login-error { color: #b3261e; font-size: 13px; margin-top: 12px; min-height: 1.2em; }
</style>
</head>
<body>

<section class="panel login-card">
  <div class="brand">
    <div class="brand-mark">KC</div>
    <div class="brand-text">
      <h1 style="font-size:16px;">Sistema de llenado de Tabs — EOIR</h1>
      <p>Kostiv Cardinal International Law Group Corp.</p>
    </div>
  </div>

  <form id="login-form">
    <label for="usuario" id="usuario-label">Usuario</label>
    <input id="usuario" name="usuario" type="text" autocomplete="username" required autofocus>

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit">Entrar</button>
    <p class="login-error" id="login-error"></p>
  </form>
</section>

<script>
// En modo Firebase el identificador es el correo electrónico; se ajusta el
// rótulo y el tipo de campo para que quede claro y el navegador ofrezca
// autocompletar el email. En modo local sigue diciendo "Usuario".
(async () => {
  try {
    const r = await fetch("/api/login-info");
    if (!r.ok) return;
    const { modo } = await r.json();
    if (modo === "firebase") {
      document.getElementById("usuario-label").textContent = "Correo electrónico";
      const inp = document.getElementById("usuario");
      inp.type = "email";
      inp.setAttribute("autocomplete", "email");
      inp.setAttribute("placeholder", "nombre@ejemplo.com");
    }
  } catch (e) { /* si falla, se queda con el rótulo por defecto */ }
})();

document.getElementById("login-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const errorEl = document.getElementById("login-error");
  errorEl.textContent = "";
  const usuario = document.getElementById("usuario").value.trim();
  const password = document.getElementById("password").value;
  try {
    const resp = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ usuario, password }),
    });
    if (!resp.ok) {
      const data = await resp.json().catch(() => ({}));
      errorEl.textContent = data.error || "No se pudo iniciar sesión.";
      return;
    }
    window.location.href = "/";
  } catch (e) {
    errorEl.textContent = "Error de conexión. Intenta de nuevo.";
  }
});
</script>

</body>
</html>
